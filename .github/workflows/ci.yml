name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift Version
        run: swift --version
      - name: Validate Package Manifest
        run: swift package dump-package > /dev/null
      - name: Build
        run: swift build -v
      - name: Run Tests
        run: swift test --enable-code-coverage
